# Conexion a MySQL (puede sobreescribirse con DB_URL, DB_USER y DB_PASSWORD) ingresar cada quien sus datos y password de la DB
db.url=jdbc:mysql://localhost:3306/asociacion_comunal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.usuario=root
db.clave=123456

# Pool de conexiones (Tomcat JDBC). Justificacion en config/DataSourceConfig y en el documento final.
pool.validationQuery=SELECT 1
pool.initialSize=2
pool.minIdle=2
pool.maxIdle=5
pool.maxActive=5
pool.maxWait=5000
pool.testOnBorrow=true
pool.testOnReturn=false
pool.testWhileIdle=true
pool.testOnConnect=true
pool.timeBetweenEvictionRunsMillis=30000
pool.minEvictableIdleTimeMillis=60000
pool.removeAbandoned=true
pool.removeAbandonedTimeout=60
pool.validationInterval=30000
